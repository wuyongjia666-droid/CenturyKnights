<!doctype html><meta charset=utf-8><title>CK tavern</title><style>
:root{
  --ink:#07090f; --panel:rgba(22,28,40,.82); --frost:#8ec8f0; --mint:#5fd4ad;
  --coral:#f07187; --text:#eef3fa; --dim:#8b95a8; --ember:#f59e6c;
  --radius:14px;
}
*{box-sizing:border-box;margin:0;padding:0;font-family:"Segoe UI",ui-sans-serif,system-ui,sans-serif}
body{background:radial-gradient(1200px 700px at 70% 10%,#152038 0%,var(--ink) 55%);color:var(--text);min-height:100vh}
button{appearance:none;border:1px solid #3a4d66;background:#1a2436;color:var(--text);
  border-radius:12px;padding:12px 16px;cursor:pointer;transition:.16s transform,.16s border-color,.16s background,.16s opacity}
button:hover{transform:translateY(-1px);border-color:var(--frost);background:#243550}
button:active{transform:translateY(1px) scale(.98)}
button:focus-visible{outline:2px solid var(--frost);outline-offset:2px}
button:disabled{opacity:.42;cursor:not-allowed;transform:none;border-color:#2a3344}
.btn-primary{background:linear-gradient(180deg,#b7dff5,#6eafd6);color:#0a1520;border:none;font-weight:650}
.btn-danger{background:#4a2030;border-color:var(--coral)}
.app{display:grid;grid-template-rows:56px 1fr;height:100vh}
.top{display:flex;gap:14px;align-items:center;padding:0 18px;backdrop-filter:blur(14px);
  background:rgba(12,16,26,.72);border-bottom:1px solid color-mix(in oklab,var(--frost) 30%,transparent)}
.crest{width:26px;height:26px;border-radius:50%;border:2px solid var(--frost);box-shadow:0 0 12px #8ec8f055}
.main{display:grid;grid-template-columns:220px 1fr;min-height:0}
.nav{padding:14px 10px;display:flex;flex-direction:column;gap:8px;background:rgba(10,14,22,.7);border-right:1px solid #243044}
.nav button{text-align:left}
.stage{padding:22px}
.card{background:var(--panel);backdrop-filter:blur(18px);border:1px solid #33455f;border-radius:var(--radius);padding:22px;max-width:960px;
  box-shadow:0 20px 60px #0006}
.h1{font-size:28px;font-weight:650;letter-spacing:.01em;margin-bottom:8px}
.muted{color:var(--dim);font-size:14px;line-height:1.55}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
.battle{display:grid;grid-template-rows:48px 1fr 128px;height:100vh}
.hud{display:flex;gap:14px;align-items:center;padding:14px 18px;background:rgba(10,14,22,.85);border-top:1px solid #2a3a50}
.token{width:64px;height:64px;border-radius:14px;border:2px solid var(--mint);background:#162033}
.atlas{display:grid;grid-template-columns:1fr 300px;gap:14px;padding:16px;height:100vh}
.map{border-radius:20px;border:1px solid #33455f;background:
  radial-gradient(circle at 42% 40%,#2a4060,#0b101a 72%)}
.badge{font-size:11px;color:var(--frost);border:1px solid #3a5a78;border-radius:999px;padding:2px 8px}
</style><div class="app"><div class="top"><strong>烽火酒馆</strong><span class="badge">hire</span></div>
<div class="main"><nav class="nav"><button>招募</button><button>辞退</button><button>返回</button></nav>
<section class="stage"><div class="card"><div class="h1">今夜到港的刃</div>
<p class="muted">Portrait stage · crystal rim cards</p>
<div class="row"><button class="btn-primary">雇佣</button><button disabled>银两不足</button></div>
</div></section></div></div>

name: ci

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test:
    name: ci
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch PR base
        if: github.event_name == 'pull_request'
        run: git fetch --no-tags origin "${{ github.base_ref }}"

      - name: Cache Godot 4.3
        uses: actions/cache@v4
        with:
          path: ~/.local/share/godot
          key: godot-4.3-stable-linux-x86_64-${{ hashFiles('scripts/install_godot.sh') }}

      - name: Cache imported assets
        uses: actions/cache@v4
        with:
          path: project/.godot/imported
          key: godot-imported-${{ hashFiles('project/project.godot') }}
          restore-keys: |
            godot-imported-

      - name: Install Godot
        run: bash scripts/install_godot.sh

      - name: Import project
        run: |
          export PATH="${HOME}/.local/bin:${PATH}"
          cd project
          ok=0
          for _try in 1 2 3; do
            if godot --headless --import; then
              ok=1
              break
            fi
            echo "import attempt ${_try} crashed; clearing imported cache"
            rm -rf .godot/imported
          done
          test "$ok" = 1

      - name: Run CI
        run: |
          export PATH="${HOME}/.local/bin:${PATH}"
          ./scripts/run_ci.sh

      - name: Upload CI logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ck-logs
          path: /tmp/ck_*.log
          if-no-files-found: ignore

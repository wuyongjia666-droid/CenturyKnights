name: ci

# What runs when: docs/ci.md. The required check is the aggregate job named `ci`.
on:
  pull_request:
  merge_group:
  push:
    branches:
      - main
  schedule:
    - cron: "23 19 * * *"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    name: changes
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      godot: ${{ steps.filter.outputs.godot }}
      bankgen: ${{ steps.filter.outputs.bankgen }}
    steps:
      - id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            godot:
              - 'project/**'
              - 'scripts/**'
              - 'tools/ci/**'
              - 'tools/check_bloodlines_v89.py'
              - 'tools/audit_v840_usage.py'
              - 'tools/farm_queue/genome_bank_v92.json'
              - 'docs/art/style-lock-*.json'
              - '.github/workflows/ci.yml'
              - '.github/actions/**'
            bankgen:
              - 'project/scripts/art/portrait_bank.gd'
              - 'project/scripts/art/genome_portrait.gd'
              - 'project/scripts/characters/genome.gd'
              - 'project/scripts/characters/bloodline_v89.gd'
              - 'project/tests/suites/art/portrait_bank_check.*'
              - 'tools/farm_queue/genome_bank_v92.json'
              - 'docs/art/style-lock-*.json'

  farm_queue:
    name: farm-queue
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate v9.2 farm queues
        run: python3 tools/farm_queue/validate_queue_v92.py

      - name: Dry-run v9.2 stills submit
        run: python3 tools/farm_queue/submit_v92_stills.py --dry-run

      - name: Submit converter tests
        run: python3 tools/farm_queue/test_submit_v92.py

      - name: Validate FARM-06/07 smoke queues
        run: python3 tools/farm_queue/validate_farm06_07.py

      - name: FARM-06/07 smoke tests
        run: python3 tools/farm_queue/test_farm06_07.py

  lint:
    name: lint
    runs-on: ubuntu-latest
    env:
      CK_PORTRAIT_BANK_FULL: ${{ github.event_name != 'pull_request' && github.event_name != 'merge_group' && '1' || '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: blob:none

      - name: Fetch PR base
        if: github.event_name == 'pull_request'
        run: git fetch --no-tags --filter=blob:none origin "${{ github.base_ref }}"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: .github/workflows/ci.yml

      - name: Install python tools
        run: python -m pip install --quiet 'gdtoolkit==4.*' pillow

      - name: Restore verified bank plates
        if: env.CK_PORTRAIT_BANK_FULL == '1'
        uses: actions/cache@v4
        with:
          path: ~/.cache/ck/bank_verified.txt
          key: ck-bank-verified-${{ github.run_id }}
          restore-keys: |
            ck-bank-verified-

      - name: Lints and ratchets
        run: ./scripts/run_ci.sh lint

  suites:
    name: godot-suites
    needs: changes
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.changes.outputs.godot == 'true') }}
    runs-on: ubuntu-latest
    env:
      CK_PORTRAIT_BANK_FULL: ${{ (github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || needs.changes.outputs.bankgen == 'true') && '1' || '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: blob:none

      - name: Fetch PR base
        if: github.event_name == 'pull_request'
        run: git fetch --no-tags --filter=blob:none origin "${{ github.base_ref }}"

      # Suites shell out to python3 tools that read WebP/PNG (placeholder, crest, audio checks).
      - name: Python image libs
        run: python3 -m pip install --quiet pillow numpy

      - name: Godot setup
        uses: ./.github/actions/godot-setup
        with:
          check-import-drift: "true"

      - name: Godot suites and e2e
        run: |
          export PATH="${HOME}/.local/bin:${PATH}"
          ./scripts/run_ci.sh godot

      - name: Upload CI logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ck-logs
          path: /tmp/ck_*.log
          if-no-files-found: ignore

  shots:
    name: shots
    needs: changes
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.changes.outputs.godot == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: System packages
        run: sudo apt-get update -qq && sudo apt-get install -y -qq xvfb libgl1-mesa-dri

      - name: Python image metrics
        run: python3 -m pip install --quiet numpy pillow

      - name: Godot setup
        uses: ./.github/actions/godot-setup

      - name: Capture screens
        run: |
          export PATH="${HOME}/.local/bin:${PATH}"
          bash scripts/capture_screens.sh /tmp/ck_shots

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ck-shots
          path: /tmp/ck_shots/*.png
          if-no-files-found: error

  ci:
    name: ci
    needs: [changes, farm_queue, lint, suites, shots]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Aggregate
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS" | python3 -c '
          import json, sys
          needs = json.load(sys.stdin)
          bad = {k: v["result"] for k, v in needs.items() if v["result"] in ("failure", "cancelled")}
          for k, v in needs.items():
              print(k.ljust(12), v["result"])
          if bad:
              sys.exit(f"failed: {bad}")
          '

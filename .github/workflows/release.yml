name: release

# Every push to main (and v* tags) builds the Windows zip and Android APK in
# parallel and publishes both on a GitHub Release. A newer main push cancels an
# older in-flight release build.
on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.ref == 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  build:
    uses: ./.github/workflows/build.yml
    with:
      windows: true
      android: true

  publish:
    name: publish
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          short="${GITHUB_SHA::8}"
          if [[ "${GITHUB_REF_TYPE}" == tag ]]; then
            tag="${GITHUB_REF_NAME}"
            title="CenturyKnights ${tag}"
          else
            tag="main-${short}"
            title="试玩包 · main ${short}"
          fi
          cd dist
          mv CenturyKnights-debug.apk "CenturyKnights-android-${short}.apk"
          sha256sum -- *.zip *.apk > "SHA256-${short}.txt"
          cat "SHA256-${short}.txt"
          subject="$(gh api "repos/${GH_REPO}/commits/${GITHUB_SHA}" --jq '.commit.message' | head -1)"
          notes="$(printf 'Built by %s from %s.\n\n%s\n' "${GITHUB_WORKFLOW}" "${GITHUB_SHA}" "${subject}")"
          if gh release view "${tag}" >/dev/null 2>&1; then
            gh release upload --clobber "${tag}" -- *.zip *.apk "SHA256-${short}.txt"
          else
            gh release create "${tag}" --target "${GITHUB_SHA}" --title "${title}" --notes "${notes}" \
              -- *.zip *.apk "SHA256-${short}.txt"
          fi

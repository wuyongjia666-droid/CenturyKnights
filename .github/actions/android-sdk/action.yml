name: android-sdk
description: JDK 17 and a cached Android SDK (cmdline-tools, platform-tools, platform 34, build-tools 34) for Godot 4.3 APK export.

runs:
  using: composite
  steps:
    - name: JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: "17"

    - name: Cache Android SDK
      id: sdk
      uses: actions/cache@v4
      with:
        path: ~/Android/Sdk
        key: android-sdk-cmdtools11076708-p34-bt34-v1

    - name: Install Android SDK
      if: steps.sdk.outputs.cache-hit != 'true'
      shell: bash
      run: |
        set -euo pipefail
        SDK="${HOME}/Android/Sdk"
        mkdir -p "${SDK}/cmdline-tools"
        curl -fL --retry 3 -o /tmp/cmdtools.zip \
          https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
        rm -rf /tmp/cmdline-tools
        unzip -q /tmp/cmdtools.zip -d /tmp
        rm -rf "${SDK}/cmdline-tools/latest"
        mv /tmp/cmdline-tools "${SDK}/cmdline-tools/latest"
        yes | "${SDK}/cmdline-tools/latest/bin/sdkmanager" --sdk_root="${SDK}" --licenses >/dev/null || true
        "${SDK}/cmdline-tools/latest/bin/sdkmanager" --sdk_root="${SDK}" \
          "platform-tools" "platforms;android-34" "build-tools;34.0.0"

    - name: Export ANDROID_SDK_ROOT
      shell: bash
      run: echo "ANDROID_SDK_ROOT=${HOME}/Android/Sdk" >> "${GITHUB_ENV}"

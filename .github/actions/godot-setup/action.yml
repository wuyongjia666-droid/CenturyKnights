name: godot-setup
description: >
  Godot 4.3 binary, optional export templates, and project/.godot restored from the
  newest main cache, then an incremental import. Caches are written only from main
  (push, schedule, dispatch) so every PR restores main's state and imports just its delta.

inputs:
  templates:
    description: "Also restore/install export templates (windows, android)"
    default: "false"
  check-import-drift:
    description: "Fail when the import rewrites or adds tracked .import files"
    default: "false"

runs:
  using: composite
  steps:
    - name: Cache Godot binary
      uses: actions/cache@v4
      with:
        path: ~/.local/share/godot/4.3-stable
        key: godot-bin-4.3-stable-${{ hashFiles('scripts/install_godot.sh') }}

    - name: Install Godot
      shell: bash
      run: bash scripts/install_godot.sh

    - name: Cache export templates
      if: inputs.templates == 'true'
      id: tpl
      uses: actions/cache@v4
      with:
        path: ~/.local/share/godot/export_templates/4.3.stable
        key: godot-templates-4.3-stable-win-android-v1

    - name: Install export templates
      if: inputs.templates == 'true' && steps.tpl.outputs.cache-hit != 'true'
      shell: bash
      run: |
        set -euo pipefail
        DEST="${HOME}/.local/share/godot/export_templates/4.3.stable"
        mkdir -p "${DEST}"
        curl -fL --retry 3 -o /tmp/godot-templates.tpz \
          https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz
        # Keep only what the Windows and Android presets use; the full set is ~1GB.
        unzip -q -j /tmp/godot-templates.tpz 'templates/version.txt' 'templates/windows_*x86_64*' 'templates/android_*' -d "${DEST}"
        rm -f /tmp/godot-templates.tpz
        ls -la "${DEST}"

    - name: Asset tree key
      id: tree
      shell: bash
      run: echo "project=$(git rev-parse HEAD:project)" >> "$GITHUB_OUTPUT"

    - name: Restore project/.godot
      id: dotgodot
      uses: actions/cache/restore@v4
      with:
        path: project/.godot
        key: godot-dotgodot-v3-${{ steps.tree.outputs.project }}
        restore-keys: |
          godot-dotgodot-v3-

    - name: Import project
      shell: bash
      run: |
        export PATH="${HOME}/.local/bin:${PATH}"
        cd project
        start=$SECONDS
        ok=0
        for _try in 1 2 3; do
          if godot --headless --import >/tmp/ck_import.log 2>&1; then
            ok=1
            break
          fi
          echo "import attempt ${_try} crashed; clearing imported cache"
          tail -20 /tmp/ck_import.log
          rm -rf .godot/imported
        done
        echo "import took $((SECONDS - start))s (cache: ${{ steps.dotgodot.outputs.cache-matched-key || 'none' }})"
        test "$ok" = 1

    - name: Guard against stale .import files
      if: inputs.check-import-drift == 'true'
      shell: bash
      run: |
        drift="$(git status --porcelain -- 'project/*.import' 'project/**/*.import')"
        if [[ -n "$drift" ]]; then
          echo "$drift" | head -40
          echo "::error::Godot rewrote or added .import files. Run 'godot --headless --import' in project/ and commit the .import changes; otherwise every CI run and fresh checkout re-imports these assets."
          exit 1
        fi

    - name: Save project/.godot
      if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && steps.dotgodot.outputs.cache-hit != 'true'
      uses: actions/cache/save@v4
      with:
        path: project/.godot
        key: godot-dotgodot-v3-${{ steps.tree.outputs.project }}
